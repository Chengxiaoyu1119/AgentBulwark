name: 本地质量门禁

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 源码、测试与浏览器验收
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/console/package-lock.json
            apps/www/package-lock.json
            apps/docs/package-lock.json

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: 安装项目依赖
        run: |
          npm --prefix apps/console ci
          npm --prefix apps/www ci
          npm --prefix apps/docs ci
          python -m pip install -r apps/api/requirements-dev.txt

      - name: 安装 Chromium
        working-directory: apps/console
        run: npx playwright install --with-deps chromium

      - name: 运行源码质量门禁
        run: |
          npm run www:verify
          npm run docs:check
          npm run docs:build
          npm run verify:local

  windows-runtime-backup:
    name: Windows 运行时备份回归
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: 安装后端测试依赖
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: 运行 Windows 备份回归
        run: python -X utf8 -m unittest apps.api.tests.test_runtime_backup
