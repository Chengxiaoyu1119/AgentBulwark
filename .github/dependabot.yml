version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: "/apps/console"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: "/apps/www"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: "/apps/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
