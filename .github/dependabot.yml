version: 2
# 关闭常规版本升级 PR；GitHub Dependabot 安全更新不受此限制。
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/apps/console"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/apps/www"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/apps/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
