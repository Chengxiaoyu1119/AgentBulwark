name: 功能建议
description: 提交明确的问题、预期价值和可验证的结果
title: "[建议]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流中的具体阻碍，而不只是实现方案。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期结果
      description: 写出用户可观察、可验证的完成状态。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方向
      description: 可选。说明已有接口、页面或文档中可复用的部分。
  - type: dropdown
    id: area
    attributes:
      label: 关联区域
      options:
        - Agent 接入与模型代理
        - MCP 工具治理
        - 策略、审批与执行回执
        - 审计、证据与可观测性
        - 控制台体验
        - 官网、文档或开发流程
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已检索现有 Issue 和文档，未发现相同建议。
          required: true
