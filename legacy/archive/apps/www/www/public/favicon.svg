<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="defenseBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="attackRed" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sentinel Eye Shape (Supervision Mechanism) -->
  <!-- Top Arc: Defense & Supervision (Blue) -->
  <path d="M 10 50 C 35 15, 65 15, 90 50" fill="none" stroke="url(#defenseBlue)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Bottom Arc: Red Team & Attack Surface (Red/Magenta) -->
  <path d="M 10 50 C 35 85, 65 85, 90 50" fill="none" stroke="url(#attackRed)" stroke-width="8" stroke-linecap="round" opacity="0.95" />

  <!-- Interception Core (Audit, Filtering & Decision) -->
  <polygon points="50,28 72,50 50,72 28,50" fill="url(#defenseBlue)" filter="url(#glow)" opacity="0.85" />
  
  <!-- Inner Iris / Intelligence Core -->
  <circle cx="50" cy="50" r="10" fill="#ffffff" />
  <circle cx="50" cy="50" r="4" fill="#0072FF" />

  <!-- Data Flow & Tool Interception Checkpoints -->
  <circle cx="10" cy="50" r="4" fill="#00C6FF" />
  <circle cx="90" cy="50" r="4" fill="#FF416C" />
  
  <!-- Crosshairs / Radar targeting -->
  <line x1="50" y1="15" x2="50" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="72" x2="50" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="15" y1="50" x2="28" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="72" y1="50" x2="85" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>