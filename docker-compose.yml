# 智安哨一键启动（Docker Compose）
#
# 使用方法：
#   1. 在仓库根目录创建 .env 文件（不要提交到 Git），写入：
#        AGENT_SUPERVISOR_AUDIT_HMAC_KEY=<任意随机字符串，用于审计链 HMAC 防篡改>
#        AGENT_SUPERVISOR_API_TOKEN=<调用 /api 接口时使用的 Bearer Token>
#   2. docker compose up -d --build
#   3. 浏览器访问 http://127.0.0.1:8012
#
# 说明：容器以 0.0.0.0 监听（非回环地址），按服务端安全策略强制要求
# API Token 鉴权与审计 HMAC 密钥，二者缺失时服务会拒绝启动（fail-closed）。

services:
  zhi-an-sentinel:
    build: .
    image: ${AGENT_SUPERVISOR_IMAGE_NAME:-zhi-an-sentinel:local}
    init: true
    ports:
      # 默认只暴露到宿主机回环地址；外部访问应经 HTTPS 反向代理进入。
      # Host 端口可由部署验收和并行环境独立覆盖，避免互相抢占 8012。
      - "127.0.0.1:${AGENT_SUPERVISOR_HOST_PORT:-8012}:8012"
    environment:
      # `${VAR:?提示}` 语法：变量缺失时 compose 直接报错退出，防止裸奔启动
      AGENT_SUPERVISOR_AUDIT_HMAC_KEY: ${AGENT_SUPERVISOR_AUDIT_HMAC_KEY:?请在 .env 中配置审计 HMAC 密钥}
      AGENT_SUPERVISOR_AUDIT_HMAC_KEY_ID: ${AGENT_SUPERVISOR_AUDIT_HMAC_KEY_ID:-deployment-hmac-v1}
      AGENT_SUPERVISOR_API_TOKEN: ${AGENT_SUPERVISOR_API_TOKEN:?请在 .env 中配置 API Token}
      AGENT_SUPERVISOR_AUTH_DISABLED: ${AGENT_SUPERVISOR_AUTH_DISABLED:-false}
      AGENT_SUPERVISOR_SECURITY_PROFILE: ${AGENT_SUPERVISOR_SECURITY_PROFILE:-production}
      AGENT_SUPERVISOR_API_TOKEN_ADMIN: ${AGENT_SUPERVISOR_API_TOKEN_ADMIN:-}
      AGENT_SUPERVISOR_API_TOKEN_EXECUTOR: ${AGENT_SUPERVISOR_API_TOKEN_EXECUTOR:-}
      AGENT_SUPERVISOR_API_TOKEN_ANALYST: ${AGENT_SUPERVISOR_API_TOKEN_ANALYST:-}
      AGENT_SUPERVISOR_API_TOKEN_OBSERVER: ${AGENT_SUPERVISOR_API_TOKEN_OBSERVER:-}
      AGENT_SUPERVISOR_AGENT_TOKENS_JSON: ${AGENT_SUPERVISOR_AGENT_TOKENS_JSON:-{}}
      AGENT_SUPERVISOR_ALLOW_SHARED_EXECUTOR_TOKEN: ${AGENT_SUPERVISOR_ALLOW_SHARED_EXECUTOR_TOKEN:-false}
      AGENT_SUPERVISOR_DEFAULT_ROLE: ${AGENT_SUPERVISOR_DEFAULT_ROLE:-observer}
      AGENT_SUPERVISOR_LOCAL_OPERATOR_ROLE: ${AGENT_SUPERVISOR_LOCAL_OPERATOR_ROLE:-admin}
      AGENT_SUPERVISOR_LABS_ENABLED: ${AGENT_SUPERVISOR_LABS_ENABLED:-false}
      AGENT_SUPERVISOR_CORS_ORIGINS: ${AGENT_SUPERVISOR_CORS_ORIGINS:-http://127.0.0.1:8012,http://localhost:8012}
      AGENT_SUPERVISOR_COMMAND_CONTAINER_IMAGE: ${AGENT_SUPERVISOR_COMMAND_CONTAINER_IMAGE:-python:3.12-alpine}
      AGENT_SUPERVISOR_COMMAND_ALLOW_WSL_FALLBACK: ${AGENT_SUPERVISOR_COMMAND_ALLOW_WSL_FALLBACK:-false}
      AGENT_SUPERVISOR_COMMAND_WSL_DISTRO: ${AGENT_SUPERVISOR_COMMAND_WSL_DISTRO:-Ubuntu}
      # LLM 网关配置必须显式传入容器；Docker 不会自动把宿主 .env
      # 中未列出的 Provider 变量带进服务进程。
      MODEL_REAL_API_ENABLED: ${MODEL_REAL_API_ENABLED:-false}
      MODEL_PROVIDER_PRIORITY: ${MODEL_PROVIDER_PRIORITY:-openai-compatible,deepseek,zhipu}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-12}
      MODEL_MAX_PROVIDER_RESPONSE_BYTES: ${MODEL_MAX_PROVIDER_RESPONSE_BYTES:-8388608}
      AGENT_SUPERVISOR_PROVIDER_DNS_MODE: ${AGENT_SUPERVISOR_PROVIDER_DNS_MODE:-system}
      AGENT_SUPERVISOR_PROVIDER_DOH_URL: ${AGENT_SUPERVISOR_PROVIDER_DOH_URL:-https://cloudflare-dns.com/dns-query}
      AGENT_SUPERVISOR_PROVIDER_DOH_TIMEOUT_SECONDS: ${AGENT_SUPERVISOR_PROVIDER_DOH_TIMEOUT_SECONDS:-5}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://api.openai.com/v1}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-gpt-4.1-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_API_URL: ${ZHIPU_API_URL:-https://open.bigmodel.cn/api/paas/v4/chat/completions}
      ZHIPU_MODEL: ${ZHIPU_MODEL:-glm-4.6v-flashx}
      OPTIMIZER_MODEL_PROVIDER_PRIORITY: ${OPTIMIZER_MODEL_PROVIDER_PRIORITY:-zhipu,deepseek,openai-compatible}
      OPTIMIZER_OPENAI_COMPATIBLE_API_KEY: ${OPTIMIZER_OPENAI_COMPATIBLE_API_KEY:-}
      OPTIMIZER_OPENAI_COMPATIBLE_BASE_URL: ${OPTIMIZER_OPENAI_COMPATIBLE_BASE_URL:-}
      OPTIMIZER_OPENAI_COMPATIBLE_MODEL: ${OPTIMIZER_OPENAI_COMPATIBLE_MODEL:-}
      OPTIMIZER_DEEPSEEK_API_KEY: ${OPTIMIZER_DEEPSEEK_API_KEY:-}
      OPTIMIZER_DEEPSEEK_BASE_URL: ${OPTIMIZER_DEEPSEEK_BASE_URL:-}
      OPTIMIZER_DEEPSEEK_MODEL: ${OPTIMIZER_DEEPSEEK_MODEL:-}
      OPTIMIZER_ZHIPU_API_KEY: ${OPTIMIZER_ZHIPU_API_KEY:-}
      OPTIMIZER_ZHIPU_API_URL: ${OPTIMIZER_ZHIPU_API_URL:-}
      OPTIMIZER_ZHIPU_MODEL: ${OPTIMIZER_ZHIPU_MODEL:-}
      TARGET_MODEL_PROVIDER_PRIORITY: ${TARGET_MODEL_PROVIDER_PRIORITY:-deepseek,zhipu,openai-compatible}
      TARGET_OPENAI_COMPATIBLE_API_KEY: ${TARGET_OPENAI_COMPATIBLE_API_KEY:-}
      TARGET_OPENAI_COMPATIBLE_BASE_URL: ${TARGET_OPENAI_COMPATIBLE_BASE_URL:-}
      TARGET_OPENAI_COMPATIBLE_MODEL: ${TARGET_OPENAI_COMPATIBLE_MODEL:-}
      TARGET_DEEPSEEK_API_KEY: ${TARGET_DEEPSEEK_API_KEY:-}
      TARGET_DEEPSEEK_BASE_URL: ${TARGET_DEEPSEEK_BASE_URL:-}
      TARGET_DEEPSEEK_MODEL: ${TARGET_DEEPSEEK_MODEL:-}
      TARGET_ZHIPU_API_KEY: ${TARGET_ZHIPU_API_KEY:-}
      TARGET_ZHIPU_API_URL: ${TARGET_ZHIPU_API_URL:-}
      TARGET_ZHIPU_MODEL: ${TARGET_ZHIPU_MODEL:-}
      TARGET_REAL_MODEL_PROVIDER: ${TARGET_REAL_MODEL_PROVIDER:-}
      REAL_MODEL_EVALUATION_PROVIDER: ${REAL_MODEL_EVALUATION_PROVIDER:-}
      AGENT_SUPERVISOR_REAL_MODEL_EVALUATION_AGENT_ID: ${AGENT_SUPERVISOR_REAL_MODEL_EVALUATION_AGENT_ID:-}
      AGENT_SUPERVISOR_PROXY_ENABLED: ${AGENT_SUPERVISOR_PROXY_ENABLED:-true}
      AGENT_SUPERVISOR_PROXY_ALLOW_LOCAL_UNAUTHENTICATED: ${AGENT_SUPERVISOR_PROXY_ALLOW_LOCAL_UNAUTHENTICATED:-false}
      AGENT_SUPERVISOR_PROXY_ALLOW_UNAUTHENTICATED_PUBLIC: ${AGENT_SUPERVISOR_PROXY_ALLOW_UNAUTHENTICATED_PUBLIC:-false}
      AGENT_SUPERVISOR_TRUST_PROXY_HEADERS: ${AGENT_SUPERVISOR_TRUST_PROXY_HEADERS:-false}
      AGENT_SUPERVISOR_PROXY_RATE_LIMIT_PER_MINUTE: ${AGENT_SUPERVISOR_PROXY_RATE_LIMIT_PER_MINUTE:-30}
      AGENT_SUPERVISOR_PROXY_RATE_LIMIT_MAX_KEYS: ${AGENT_SUPERVISOR_PROXY_RATE_LIMIT_MAX_KEYS:-10000}
      AGENT_SUPERVISOR_PROXY_ALLOW_PROVIDER_FAILOVER: ${AGENT_SUPERVISOR_PROXY_ALLOW_PROVIDER_FAILOVER:-false}
      AGENT_SUPERVISOR_PROXY_ALLOW_MODEL_OVERRIDE: ${AGENT_SUPERVISOR_PROXY_ALLOW_MODEL_OVERRIDE:-false}
      AGENT_SUPERVISOR_PROXY_MODE: ${AGENT_SUPERVISOR_PROXY_MODE:-transparent}
      AGENT_SUPERVISOR_PROXY_ALLOW_RESEARCH_MODE: ${AGENT_SUPERVISOR_PROXY_ALLOW_RESEARCH_MODE:-false}
      AGENT_SUPERVISOR_PROXY_STREAM_SAFETY_WINDOW_CHARS: ${AGENT_SUPERVISOR_PROXY_STREAM_SAFETY_WINDOW_CHARS:-256}
      AGENT_SUPERVISOR_PROXY_REQUIRE_TOOL_RECEIPTS: ${AGENT_SUPERVISOR_PROXY_REQUIRE_TOOL_RECEIPTS:-true}
      AGENT_SUPERVISOR_PROXY_REQUIRE_SERVER_OBSERVED_RECEIPTS: ${AGENT_SUPERVISOR_PROXY_REQUIRE_SERVER_OBSERVED_RECEIPTS:-true}
      AGENT_SUPERVISOR_PROXY_EXPOSE_REASONING: ${AGENT_SUPERVISOR_PROXY_EXPOSE_REASONING:-false}
      AGENT_SUPERVISOR_PROXY_MAX_TOOL_ROUNDS: ${AGENT_SUPERVISOR_PROXY_MAX_TOOL_ROUNDS:-3}
      AGENT_SUPERVISOR_PROXY_OPTIMIZER_ENABLED: ${AGENT_SUPERVISOR_PROXY_OPTIMIZER_ENABLED:-true}
      AGENT_SUPERVISOR_PROXY_FORCE_REAL_OPTIMIZER: ${AGENT_SUPERVISOR_PROXY_FORCE_REAL_OPTIMIZER:-false}
      AGENT_SUPERVISOR_PROXY_FORCE_REAL_TARGET: ${AGENT_SUPERVISOR_PROXY_FORCE_REAL_TARGET:-false}
      AGENT_SUPERVISOR_PROXY_OPTIMIZER_MODEL: ${AGENT_SUPERVISOR_PROXY_OPTIMIZER_MODEL:-}
      AGENT_SUPERVISOR_PROXY_TARGET_MODEL: ${AGENT_SUPERVISOR_PROXY_TARGET_MODEL:-}
      AGENT_SUPERVISOR_PROXY_RESOURCE_GOVERNANCE_ENABLED: ${AGENT_SUPERVISOR_PROXY_RESOURCE_GOVERNANCE_ENABLED:-true}
      AGENT_SUPERVISOR_PROXY_MAX_CONCURRENCY_PER_AGENT: ${AGENT_SUPERVISOR_PROXY_MAX_CONCURRENCY_PER_AGENT:-8}
      AGENT_SUPERVISOR_PROXY_TOKEN_BUDGET_PER_MINUTE: ${AGENT_SUPERVISOR_PROXY_TOKEN_BUDGET_PER_MINUTE:-1000000}
      AGENT_SUPERVISOR_PROXY_COST_BUDGET_PER_MINUTE_USD: ${AGENT_SUPERVISOR_PROXY_COST_BUDGET_PER_MINUTE_USD:-0}
      AGENT_SUPERVISOR_PROXY_DEFAULT_OUTPUT_TOKENS: ${AGENT_SUPERVISOR_PROXY_DEFAULT_OUTPUT_TOKENS:-1024}
      AGENT_SUPERVISOR_PROXY_MANAGED_CONTEXT_TOKENS: ${AGENT_SUPERVISOR_PROXY_MANAGED_CONTEXT_TOKENS:-16384}
      AGENT_SUPERVISOR_PROXY_INPUT_COST_PER_1K_USD: ${AGENT_SUPERVISOR_PROXY_INPUT_COST_PER_1K_USD:-0}
      AGENT_SUPERVISOR_PROXY_OUTPUT_COST_PER_1K_USD: ${AGENT_SUPERVISOR_PROXY_OUTPUT_COST_PER_1K_USD:-0}
      AGENT_SUPERVISOR_PROXY_RESOURCE_MAX_KEYS: ${AGENT_SUPERVISOR_PROXY_RESOURCE_MAX_KEYS:-10000}
      AGENT_SUPERVISOR_PROXY_RESOURCE_LEASE_TTL_SECONDS: ${AGENT_SUPERVISOR_PROXY_RESOURCE_LEASE_TTL_SECONDS:-300}
      MCP_GATEWAY_UPSTREAM_COMMAND: ${MCP_GATEWAY_UPSTREAM_COMMAND:-}
      MCP_GATEWAY_UPSTREAM_ENV_ALLOWLIST: ${MCP_GATEWAY_UPSTREAM_ENV_ALLOWLIST:-}
      MCP_GATEWAY_TIMEOUT_SECONDS: ${MCP_GATEWAY_TIMEOUT_SECONDS:-10}
      MCP_GATEWAY_MAX_MESSAGE_BYTES: ${MCP_GATEWAY_MAX_MESSAGE_BYTES:-1048576}
      MCP_GATEWAY_MAX_PENDING_RESPONSES: ${MCP_GATEWAY_MAX_PENDING_RESPONSES:-256}
      MCP_GATEWAY_ALLOW_SIDE_EFFECT_NOTIFICATIONS: ${MCP_GATEWAY_ALLOW_SIDE_EFFECT_NOTIFICATIONS:-false}
      MCP_GATEWAY_RESOURCE_LIMITS_ENABLED: ${MCP_GATEWAY_RESOURCE_LIMITS_ENABLED:-true}
      MCP_GATEWAY_NETWORK_MODE: ${MCP_GATEWAY_NETWORK_MODE:-reject-unpinned}
      MCP_GATEWAY_SESSION_ISOLATION: ${MCP_GATEWAY_SESSION_ISOLATION:-true}
      MCP_GATEWAY_MAX_SESSIONS: ${MCP_GATEWAY_MAX_SESSIONS:-128}
      MCP_GATEWAY_MAX_SUBSCRIPTIONS: ${MCP_GATEWAY_MAX_SUBSCRIPTIONS:-128}
      MCP_GATEWAY_REQUEST_STATE_SECRET: ${MCP_GATEWAY_REQUEST_STATE_SECRET:-}
      MCP_GATEWAY_MRTR_TIMEOUT_SECONDS: ${MCP_GATEWAY_MRTR_TIMEOUT_SECONDS:-300}
      MCP_GATEWAY_MAX_CPU_SECONDS: ${MCP_GATEWAY_MAX_CPU_SECONDS:-30}
      MCP_GATEWAY_MAX_MEMORY_BYTES: ${MCP_GATEWAY_MAX_MEMORY_BYTES:-536870912}
      MCP_GATEWAY_MAX_PIDS: ${MCP_GATEWAY_MAX_PIDS:-128}
      MCP_GATEWAY_MAX_OPEN_FILES: ${MCP_GATEWAY_MAX_OPEN_FILES:-256}
      MCP_GATEWAY_MAX_FILE_BYTES: ${MCP_GATEWAY_MAX_FILE_BYTES:-16777216}
    volumes:
      - zhi-an-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.request; request=urllib.request.Request('http://127.0.0.1:8012/api/health', headers={'Authorization':'Bearer '+os.environ['AGENT_SUPERVISOR_API_TOKEN']}); urllib.request.urlopen(request, timeout=3)\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  zhi-an-data:
